[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kstt"
version = "0.1.0"
description = "Kali Security Testing Toolkit for authorized labs and assessments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["rich>=13.7", "PyYAML>=6.0"]
monitor = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
test = ["pytest>=8.0"]

[project.scripts]
kstt = "kstt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
